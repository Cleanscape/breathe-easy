# Builds the iPhone and Android apps on Expo's servers (EAS Build).
# Needs a repository secret EXPO_TOKEN: an Expo access token from
# https://expo.dev/accounts/stellaforgestudios/settings/access-tokens
# iPhone builds also need an App Store Connect API key, as repository secrets:
#   ASC_API_KEY (the whole .p8 file text), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
# EAS uses it to register the bundle ID and create the signing certificate and profile.
# Run it from the Actions tab: Build apps > Run workflow.
name: Build apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build profile from eas.json
        type: choice
        options: [production, preview]
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm test
      # Creates the Expo project on the first run and links to it after that.
      - run: eas init --force --non-interactive
      # Optional: only used when all four App Store Connect secrets are set
      # (signing credentials already live on Expo's servers).
      - name: App Store Connect API key (iPhone builds)
        if: inputs.platform != 'android'
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_API_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            printf '%s\n' "$ASC_API_KEY" > "$RUNNER_TEMP/asc_api_key.p8"
            {
              echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8"
              echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID"
              echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID"
              echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID"
              echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL"
            } >> "$GITHUB_ENV"
          else
            echo "App Store Connect secrets not all set; using the credentials stored on Expo."
          fi
      - run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
