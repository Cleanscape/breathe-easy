# Builds the iPhone and Android apps on Expo's servers (EAS Build).
# Needs a repository secret EXPO_TOKEN: an Expo access token from
# https://expo.dev/accounts/stellaforgestudios/settings/access-tokens
# Run it from the Actions tab: Build apps > Run workflow.
name: Build apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build profile from eas.json
        type: choice
        options: [production, preview]
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm test
      # Creates the Expo project on the first run and links to it after that.
      - run: eas init --force --non-interactive
      - run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
