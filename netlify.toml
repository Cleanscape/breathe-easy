# Netlify builds and publishes the web version on every push to main.
[build]
  command = "npm test && npx expo export --platform web --output-dir dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Any path loads the app, so a refresh never shows a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
